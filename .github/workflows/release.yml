name: release

# Manager releases (docs/RELEASING.md). On every push to main:
#
#   version       contents+pull-requests: write; changesets/action opens or updates
#                 the "Version Packages" PR while changesets are pending. Runs no
#                 dependency install scripts.
#   plan          read-only; once no changesets are pending, releases
#                 apps/manager/package.json's version unless the GitHub Release
#                 manager@<version> already exists (so merging the version PR
#                 releases, and a re-run or manual run publishes whatever is missing)
#   build-packer  read-only; builds @appflare/pack into a self-contained bundle,
#                 never builds or runs manager code
#   build         read-only, no secrets; builds and packs the manager into an
#                 unsigned intermediate with keyId appflare-2026-09
#   sign          APPFLARE_SIGNING_KEY only; runs only the packer bundle, and signs
#                 only a manifest.json whose app, version, source, and keyId match
#                 the plan
#   release       contents: write; verifies against the embedded signing keys and
#                 creates the GitHub Release manager@<version>
#
# Nothing is published to npm in v1.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  KEY_ID: appflare-2026-09

jobs:
  version:
    name: version PR
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      has-changesets: ${{ steps.changesets.outputs.has-changesets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      # Only the Changesets CLI is needed here; no dependency runs install scripts
      # in a job holding a write token.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - id: changesets
        # changesets/action v2 pushes the version branch through the GitHub API
        # with github-token, so the checkout keeps no credentials.
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm changeset version
          commit-message: Version Packages
          pr-title: Version Packages
          github-token: ${{ github.token }}

  plan:
    name: plan
    needs: version
    if: needs.version.outputs.has-changesets == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(jq -r .version apps/manager/package.json)"
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error file=apps/manager/package.json::version ${version} is not semver"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          if [ "${version}" = "0.0.0" ]; then
            echo "::notice::apps/manager is still 0.0.0; nothing to release"
            echo "release=false" >> "${GITHUB_OUTPUT}"
          elif gh release view "manager@${version}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "::notice::manager@${version} is already released"
            echo "release=false" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::releasing manager@${version} from ${GITHUB_SHA}"
            echo "release=true" >> "${GITHUB_OUTPUT}"
          fi

  build-packer:
    name: build packer
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Build and bundle @appflare/pack
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          # Only the packer and what it bundles (schema, cf-api), not the manager.
          pnpm exec turbo run build --filter=@appflare/pack...
          out="${RUNNER_TEMP}/appflare-packer"
          rm -rf "${out}"
          # --legacy: pnpm 10's deploy otherwise requires inject-workspace-packages.
          pnpm --filter @appflare/pack deploy --prod --legacy "${out}/packages/pack"
          # tar keeps node_modules' (relative) symlinks, which artifact upload would not.
          tar -C "${out}" -czf "${RUNNER_TEMP}/appflare-packer.tgz" packages
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: appflare-packer
          path: ${{ runner.temp }}/appflare-packer.tgz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  build:
    name: build and pack the manager
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Runs the manager's build and its dependencies' code: no secrets, read-only
    # token, no persisted credentials.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - name: Build, pack an unsigned intermediate, verify hashes
        env:
          APPFLARE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          # Bakes APPFLARE_VERSION into the Worker, stamps source.ref/sha, packs
          # with keyId appflare-2026-09 (no signature), checks the artifact.
          pnpm release:pack --out dist/release --key-id "${KEY_ID}"
          node packages/pack/bin/appflare-pack.js verify dist/release --hashes-only
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-manager
          path: dist/release
          if-no-files-found: error
          retention-days: 7

  sign:
    name: sign
    needs: [plan, build-packer, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Holds the signing key. No checkout, no dependency install, no build: only
    # the packer bundle, on an artifact that must match the plan before signing.
    permissions: {}
    steps:
      - name: Require APPFLARE_SIGNING_KEY
        env:
          APPFLARE_SIGNING_KEY: ${{ secrets.APPFLARE_SIGNING_KEY }}
        run: |
          if [ -z "${APPFLARE_SIGNING_KEY}" ]; then
            echo "::error title=APPFLARE_SIGNING_KEY is not set::Manager releases are signed. Add the signing key (base64 PKCS#8 Ed25519, key id appflare-2026-09) as the APPFLARE_SIGNING_KEY Actions secret of the appflare org or this repository, then re-run this workflow (docs/RELEASING.md)."
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Download the packer bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: appflare-packer
          path: ${{ runner.temp }}/appflare-packer
      - name: Download exactly unsigned-manager
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-manager
          path: release
      - name: Check against the plan, verify hashes, sign, verify the signature
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          APPFLARE_SIGNING_KEY: ${{ secrets.APPFLARE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/appflare"
          tar -xzf "${RUNNER_TEMP}/appflare-packer/appflare-packer.tgz" -C "${RUNNER_TEMP}/appflare"
          pack="${RUNNER_TEMP}/appflare/packages/pack/bin/appflare-pack.js"
          expected="$(printf '%s\n' "appflare-${VERSION}.zip" manifest.json | LC_ALL=C sort | paste -sd, -)"
          present="$(find release -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort | paste -sd, -)"
          if [ "${present}" != "${expected}" ]; then
            echo "::error::unsigned-manager holds ${present}, expected ${expected}"
            exit 1
          fi
          check() {
            local got
            got="$(jq -r "$1" release/manifest.json)"
            if [ "${got}" != "$2" ]; then
              echo "::error::manifest.json $1 is ${got}, expected $2"
              exit 1
            fi
          }
          check .app appflare
          check .version "${VERSION}"
          check .keyId "${KEY_ID}"
          check .source.repo "${GITHUB_REPOSITORY}"
          check .source.sha "${GITHUB_SHA}"
          check .source.ref "${VERSION}"
          node "${pack}" verify release --hashes-only
          node "${pack}" sign release --sign-key-env APPFLARE_SIGNING_KEY --key-id "${KEY_ID}"
          # Against the public keys embedded in @appflare/schema at this commit.
          node "${pack}" verify release --require-signed
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-manager
          path: release
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub Release
    needs: [plan, build-packer, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # For the changelog only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Download the packer bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: appflare-packer
          path: ${{ runner.temp }}/appflare-packer
      - name: Download signed-manager
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-manager
          path: ${{ runner.temp }}/release
      # No token in this step: it runs the packer bundle.
      - name: Verify the signed artifact
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/appflare"
          tar -xzf "${RUNNER_TEMP}/appflare-packer/appflare-packer.tgz" -C "${RUNNER_TEMP}/appflare"
          pack="${RUNNER_TEMP}/appflare/packages/pack/bin/appflare-pack.js"
          dir="${RUNNER_TEMP}/release"
          if [ "$(jq -r .app "${dir}/manifest.json")" != appflare ] || [ "$(jq -r .version "${dir}/manifest.json")" != "${VERSION}" ]; then
            echo "::error::signed-manager is not appflare@${VERSION}"
            exit 1
          fi
          node "${pack}" verify "${dir}" --require-signed
      # The write token is visible to gh only, never to the packer.
      - name: Create the GitHub Release
        env:
          WRITE_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/release"
          tag="manager@${VERSION}"
          if GH_TOKEN="${WRITE_TOKEN}" gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "::error::release ${tag} already exists; delete it by hand to re-release"
            exit 1
          fi
          # Release notes: this version's section of the Changesets changelog.
          notes="${RUNNER_TEMP}/notes.md"
          awk -v heading="## ${VERSION}" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' apps/manager/CHANGELOG.md > "${notes}" 2> /dev/null || true
          if ! grep -q '[^[:space:]]' "${notes}"; then
            echo "No changelog entry for ${VERSION}." > "${notes}"
          fi
          digest="$(sha256sum "${dir}/manifest.json" | cut -d' ' -f1)"
          printf '\n---\nBuilt from %s@%s. Signed with key id %s. manifest.json sha256: %s.\n' \
            "${GITHUB_REPOSITORY}" "${GITHUB_SHA}" "${KEY_ID}" "${digest}" >> "${notes}"
          prerelease=()
          if [[ "${VERSION}" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          GH_TOKEN="${WRITE_TOKEN}" gh release create "${tag}" \
            "${dir}/appflare-${VERSION}.zip" "${dir}/manifest.json" "${dir}/manifest.sig" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Appflare ${VERSION}" \
            --notes-file "${notes}" \
            "${prerelease[@]}"
