name: ci

# Pull requests and main: lint every new commit message, typecheck, lint, and
# test every package, build the dist outputs, smoke-test them, and check the root
# release scripts against the built manager. No secrets, read-only token.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  commits:
    name: commit messages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      # commitlint needs no build step, so no dependency install script runs.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Lint every commit in the push or pull request
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -n "${BASE}" && ! "${BASE}" =~ ^0+$ ]] && git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            pnpm exec commitlint --from "${BASE}" --to "${HEAD_SHA}" --verbose
          else
            # A new branch or rewritten history: the old tip is gone, so lint
            # every commit reachable from HEAD, root commits included.
            for root in $(git rev-list --max-parents=0 "${HEAD_SHA}"); do
              git log -1 --format=%B "${root}" | pnpm exec commitlint --verbose
              pnpm exec commitlint --from "${root}" --to "${HEAD_SHA}" --verbose
            done
          fi

  check:
    name: check, build, test:dist
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm 10, the exact version from package.json's packageManager field.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm test:dist
      # scripts/ is not a workspace package, so `pnpm check` does not cover it.
      # The test packs the manager built above and checks the artifact.
      - name: Check the root release scripts
        # Packing the sandbox Worker artifact in-process holds the whole zip and its
        # module index in memory, which no longer fits Node's default heap.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          pnpm exec tsc -p scripts --noEmit
          pnpm exec biome check scripts
          pnpm exec vitest run --config scripts/vitest.config.ts
