name: ci

# Pull requests and main: typecheck, lint, and test every package, build the
# dist outputs, smoke-test them, and check the root release scripts against the
# built manager. No secrets, read-only token.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    name: check, build, test:dist
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm 10, the exact version from package.json's packageManager field.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm test:dist
      # scripts/ is not a workspace package, so `pnpm check` does not cover it.
      # The test packs the manager built above and checks the artifact.
      - name: Check the root release scripts
        run: |
          pnpm exec tsc -p scripts --noEmit
          pnpm exec biome check scripts
          pnpm exec vitest run --config scripts/vitest.config.ts
