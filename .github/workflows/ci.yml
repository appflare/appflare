name: ci

# Pull requests and main: lint every new commit message, typecheck, lint, and
# test every package, build the dist outputs, smoke-test them, and check the root
# release scripts against the built manager. No secrets, read-only token.
#
# The jobs run side by side. The manager's tests are the longest part, so they
# are split across a matrix of shards; every other package checks in one job.
# Each job keeps Turbo's cache between runs (.github/actions/setup), so a task
# whose inputs did not change replays its earlier result instead of running.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  commits:
    name: commit messages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      # commitlint needs no build step, so no dependency install script runs.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Lint every commit in the push or pull request
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -n "${BASE}" && ! "${BASE}" =~ ^0+$ ]] && git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            pnpm exec commitlint --from "${BASE}" --to "${HEAD_SHA}" --verbose
          else
            # A new branch or rewritten history: the old tip is gone, so lint
            # every commit reachable from HEAD, root commits included.
            for root in $(git rev-list --max-parents=0 "${HEAD_SHA}"); do
              git log -1 --format=%B "${root}" | pnpm exec commitlint --verbose
              pnpm exec commitlint --from "${root}" --to "${HEAD_SHA}" --verbose
            done
          fi

  check:
    name: check (packages but the manager)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache: check
      # `pnpm check` without the manager, which the `manager` job covers.
      - run: pnpm exec turbo run typecheck lint test --filter='!@appflare/manager'

  manager:
    name: manager ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "typecheck, lint", id: check, tasks: typecheck lint, args: "" }
          - { name: "test 1/3", id: test-1, tasks: test, args: "-- --shard=1/3" }
          - { name: "test 2/3", id: test-2, tasks: test, args: "-- --shard=2/3" }
          - { name: "test 3/3", id: test-3, tasks: test, args: "-- --shard=3/3" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache: manager-${{ matrix.id }}
      # Turbo hashes the arguments after `--`, so each shard caches on its own.
      - run: pnpm exec turbo run ${{ matrix.tasks }} --filter=@appflare/manager ${{ matrix.args }}

  build:
    name: build, test:dist
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache: build
      - run: pnpm build
      - run: pnpm test:dist
      # scripts/ is not a workspace package, so `pnpm check` does not cover it.
      # The test packs the manager built above and checks the artifact.
      - name: Check the root release scripts
        run: |
          pnpm exec tsc -p scripts --noEmit
          pnpm exec biome check scripts
          pnpm exec vitest run --config scripts/vitest.config.ts
