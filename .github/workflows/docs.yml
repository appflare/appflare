name: docs

# Builds the documentation site (apps/docs, Fumadocs on TanStack Start, fully
# prerendered) and deploys dist/client as the Worker `appflare-docs`: static
# assets, plus a small Worker that forwards /api/install/* to the hosted
# installer (apps/installer, the Worker `appflare-installer`) through a
# service binding. The installer is deployed first in each environment, since
# the site's binding points at it. The manifest reference page is generated
# from @appflare/schema during the build, so schema changes redeploy the site.
#
# The site also carries the whole catalog (/apps/, one page per app, one per
# category), taken from the published catalog when the build starts. So it is
# rebuilt when the catalog publishes (the catalog's publish workflow dispatches
# this workflow; see docs/RELEASING.md) and once a day, which keeps star counts
# current. A failed fetch fails the build and leaves the deployed site as it was.
#
# Two deploys of the same build, in order:
#   dev          the preview (installer, then site), in the development account
#                on its workers.dev address. Every run.
#   production   appflare.dev (installer, then site), in the account that owns
#                the zone, with the
#                DOCS_CLOUDFLARE_API_TOKEN and DOCS_CLOUDFLARE_ACCOUNT_ID
#                secrets. Only after the preview deployed and answered, so a
#                broken build never reaches appflare.dev. Skipped (with a
#                notice) when either secret is missing, and on a manual run
#                with target=dev. apps/docs/README.md has the setup.

on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      # The hosted installer behind /api/install/*, and the OAuth helpers the
      # deploy page and the installer share.
      - "apps/installer/**"
      - "packages/cf-api/**"
      - "packages/schema/**"
      # The site's logos, and the toolchain the build runs with.
      - "docs/assets/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "turbo.json"
      - ".github/workflows/docs.yml"
  # The catalog's publish workflow dispatches with no inputs, so the default
  # target is production.
  workflow_dispatch:
    inputs:
      target:
        description: "production: the preview, then appflare.dev. dev: the preview only."
        required: false
        default: production
        type: choice
        options:
          - production
          - dev
  schedule:
    # Daily, at an odd minute to stay clear of the top-of-hour rush.
    - cron: "17 5 * * *"

permissions:
  contents: read

# One deploy at a time, never cancelled halfway; a newer push waits and deploys
# after it.
concurrency:
  group: docs-deploy
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  dev:
    name: build and deploy the preview (development account)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # The preview's address: the Worker's name on the development account's
      # workers.dev subdomain.
      PREVIEW_URL: https://appflare-docs.appflare-dev.workers.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm 10, the exact version from package.json's packageManager field.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds @appflare/schema first (turbo's ^build), then the site, from
      # the published catalog rather than the checked-in snapshot the other
      # builds use.
      - run: pnpm exec turbo run build --filter=@appflare/docs...
        env:
          CATALOG_SNAPSHOT: live
      # The build fails on its own when a page cannot be prerendered or an
      # OpenGraph image cannot be drawn; this catches a file that went missing.
      - name: Check the site has its search index, agent files, redirects, images and deploy page
        working-directory: apps/docs/dist/client
        run: |
          for file in index.html 404.html api/search.json llms.txt llms-full.txt \
            sitemap.xml start/overview.md start/install/index.html start/install.md \
            agent/install.md agent/submit.md _redirects _headers \
            og/image.png og/start/install/image.png apps/index.html og/apps/image.png \
            deploy/index.html deploy/callback.html; do
            test -s "${file}" || { echo "::error::apps/docs/dist/client/${file} is missing"; exit 1; }
          done
          # The build appends each deploy page's own headers, with the hashes
          # of its inline scripts, for its exact path.
          for path in /deploy/ /deploy/callback; do
            grep -A1 -x "${path}" _headers |
              grep -q "Content-Security-Policy: default-src 'none'; script-src 'self' 'sha256-" ||
              { echo "::error::_headers has no Content-Security-Policy for ${path}"; exit 1; }
          done
      # `pnpm wrangler` loads .env over the environment, which would replace
      # the secrets below. .env is gitignored, so a checkout never has one;
      # this makes sure of it.
      - name: Check there is no .env
        run: |
          if [[ -e .env ]]; then
            echo "::error::.env exists in the checkout; pnpm wrangler would load it over the deploy secrets"
            exit 1
          fi
      # wrangler deploys to the account_id pinned in each wrangler.jsonc and
      # ignores CLOUDFLARE_ACCOUNT_ID when the config has one. Both must name the
      # same account, or the token in the secret cannot deploy there.
      - name: Check the pinned accounts match the secret
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for config in apps/installer/wrangler.jsonc apps/docs/wrangler.jsonc; do
            pinned=$(CONFIG="${config}" node --input-type=module -e '
              import { unstable_readConfig } from "wrangler";
              process.stdout.write(unstable_readConfig({ config: process.env.CONFIG }).account_id ?? "");
            ')
            if [[ -z "${CLOUDFLARE_ACCOUNT_ID}" || "${pinned}" != "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
              echo "::error::${config} account_id does not match the CLOUDFLARE_ACCOUNT_ID secret"
              exit 1
            fi
          done
      # The new Appflare answers its handoff only to the installer's origin and
      # reports back there, so it must be the address the deploy page is
      # served from.
      - name: Check the installer names the preview as its origin
        run: |
          origin=$(node --input-type=module -e '
            import { unstable_readConfig } from "wrangler";
            process.stdout.write(String(unstable_readConfig({ config: "apps/installer/wrangler.jsonc" }).vars?.INSTALLER_ORIGIN ?? ""));
          ')
          if [[ "${origin}" != "${PREVIEW_URL}" ]]; then
            echo "::error::apps/installer/wrangler.jsonc INSTALLER_ORIGIN is \"${origin}\", expected ${PREVIEW_URL}"
            exit 1
          fi
      # First, since the site's service binding points at it. wrangler creates
      # the installer's D1 database on its first deploy and finds it by name later.
      - name: Deploy the installer (preview)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: pnpm wrangler -c apps/installer/wrangler.jsonc deploy --env=""
      # `--env=""` is the top level of the config: workers.dev, no routes.
      - name: Deploy the preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: pnpm wrangler -c apps/docs/wrangler.jsonc deploy --env=""
      - name: Check the preview answers
        run: |
          for path in / /start/install/ /apps/ /no-such-page/ /badge.svg /deploy/ /deploy/callback; do
            expected=200
            [[ "${path}" == /no-such-page/ ]] && expected=404
            status=$(curl -sS -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 3 \
              --retry-all-errors "${PREVIEW_URL}${path}" || true)
            if [[ "${status}" != "${expected}" ]]; then
              echo "::error::${PREVIEW_URL}${path} answered ${status}, expected ${expected}"
              exit 1
            fi
          done
          # `/` is the front page, not the documentation's index.
          if ! curl -sS --retry 5 --retry-delay 3 --retry-all-errors "${PREVIEW_URL}/" |
            grep -q "Deploy to Cloudflare"; then
            echo "::error::${PREVIEW_URL}/ does not say \"Deploy to Cloudflare\"; it is not the front page"
            exit 1
          fi
          # The index's Markdown moved to the overview; public/_redirects sends
          # the old address there.
          redirect=$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' --retry 5 \
            --retry-delay 3 --retry-all-errors "${PREVIEW_URL}/index.md" || true)
          if [[ "${redirect}" != "301 ${PREVIEW_URL}/start/overview.md" ]]; then
            echo "::error::${PREVIEW_URL}/index.md answered \"${redirect}\", expected a 301 to /start/overview.md"
            exit 1
          fi
          # The deploy pages carry their own Content-Security-Policy and send
          # no referrer.
          for path in /deploy/ /deploy/callback; do
            headers=$(curl -sS -D - -o /dev/null --retry 5 --retry-delay 3 --retry-all-errors \
              "${PREVIEW_URL}${path}" | tr -d '\r')
            grep -qi "^content-security-policy:.*script-src 'self' 'sha256-" <<<"${headers}" &&
              grep -qi "^referrer-policy: no-referrer$" <<<"${headers}" || {
              echo "::error::${PREVIEW_URL}${path} lacks the deploy pages' Content-Security-Policy or Referrer-Policy"
              exit 1
            }
          done
          # /api/install/* reaches the installer through the site's Worker: a
          # request without a Cloudflare token gets the installer's own 401.
          answer=$(curl -sS -X POST -H 'content-type: application/json' -d '{}' \
            -w ' %{http_code}' --retry 5 --retry-delay 3 --retry-all-errors \
            "${PREVIEW_URL}/api/install/accounts" || true)
          if [[ "${answer}" != *'"code":"unauthorized"'*' 401' ]]; then
            echo "::error::${PREVIEW_URL}/api/install/accounts answered \"${answer}\", expected the installer's 401"
            exit 1
          fi
      # The exact files the preview serves go to production.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-site
          path: apps/docs/dist/client
          if-no-files-found: error
          retention-days: 1

  production:
    name: deploy appflare.dev
    needs: dev
    # Only main reaches appflare.dev. A manual run from another branch still
    # starts this job, so its first step can say why nothing was deployed.
    if: >-
      (github.event_name != 'workflow_dispatch' || inputs.target != 'dev')
      && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Only whether each secret is set leaves this step, never a value.
      - name: Check this run may deploy appflare.dev
        id: secrets
        env:
          HAS_TOKEN: ${{ secrets.DOCS_CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.DOCS_CLOUDFLARE_ACCOUNT_ID != '' }}
          REF: ${{ github.ref }}
        run: |
          if [[ "${REF}" != refs/heads/main ]]; then
            echo "::notice title=appflare.dev was not deployed::Only main deploys appflare.dev; this run is for ${REF}. The preview was deployed."
            echo "ready=false" >> "${GITHUB_OUTPUT}"
          elif [[ "${HAS_TOKEN}" == "true" && "${HAS_ACCOUNT}" == "true" ]]; then
            echo "ready=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice title=appflare.dev was not deployed::Set the DOCS_CLOUDFLARE_API_TOKEN and DOCS_CLOUDFLARE_ACCOUNT_ID Actions secrets for the account that owns the appflare.dev zone (apps/docs/README.md), then re-run this workflow. The preview was deployed."
            echo "ready=false" >> "${GITHUB_OUTPUT}"
          fi
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.secrets.outputs.ready == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - if: steps.secrets.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-site
          path: apps/docs/dist/client
      - name: Check there is no .env
        if: steps.secrets.outputs.ready == 'true'
        run: |
          if [[ -e .env ]]; then
            echo "::error::.env exists in the checkout; pnpm wrangler would load it over the deploy secrets"
            exit 1
          fi
      # wrangler takes the account from the config's account_id before
      # CLOUDFLARE_ACCOUNT_ID, and the checked-in configs pin the development
      # account (their production environments inherit it). So this deploys
      # from copies without account_id, written next to the originals so their
      # paths (main, assets) still resolve, and never kept in the repository.
      - name: Write the production configs
        id: config
        if: steps.secrets.outputs.ready == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.DOCS_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            import { experimental_readRawConfig, unstable_readConfig } from "wrangler";
            function fail(message) {
              console.log("::error::" + message);
              process.exit(1);
            }
            for (const app of ["installer", "docs"]) {
              const source = "apps/" + app + "/wrangler.jsonc";
              const { rawConfig } = experimental_readRawConfig({ config: source });
              // Only the top-level account_id is removed below; one in an
              // environment would win over CLOUDFLARE_ACCOUNT_ID again.
              for (const [name, env] of Object.entries(rawConfig.env ?? {})) {
                if (env && "account_id" in env) {
                  fail(source + " sets account_id in env." + name + "; only the top level may pin an account");
                }
              }
              if (rawConfig.account_id === process.env.CLOUDFLARE_ACCOUNT_ID) {
                fail("DOCS_CLOUDFLARE_ACCOUNT_ID names the development account; it must be the account that owns appflare.dev");
              }
              delete rawConfig.account_id;
              writeFileSync("apps/" + app + "/wrangler.production.json", JSON.stringify(rawConfig, null, 2) + "\n");
            }
            const [domain] = unstable_readConfig({ config: "apps/docs/wrangler.jsonc", env: "production" }).routes ?? [];
            const host = typeof domain === "string" ? domain : domain?.pattern;
            if (!host) fail("the production environment in apps/docs/wrangler.jsonc has no route");
            const site = "https://" + host;
            // The new Appflare answers its handoff only to this origin.
            const installer = unstable_readConfig({ config: "apps/installer/wrangler.jsonc", env: "production" });
            if (installer.vars?.INSTALLER_ORIGIN !== site) {
              fail("the production INSTALLER_ORIGIN in apps/installer/wrangler.jsonc is not " + site);
            }
            if (installer.vars?.INSTALLER_ENV !== "production") {
              fail("the production INSTALLER_ENV in apps/installer/wrangler.jsonc is not production");
            }
            writeFileSync(process.env.GITHUB_OUTPUT, "site=" + site + "\n", { flag: "a" });
          '
      # First, since the site's service binding points at it.
      - name: Deploy the installer for appflare.dev
        if: steps.secrets.outputs.ready == 'true' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.DOCS_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.DOCS_CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: pnpm wrangler -c apps/installer/wrangler.production.json deploy --env production
      - name: Deploy appflare.dev
        if: steps.secrets.outputs.ready == 'true' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.DOCS_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.DOCS_CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: pnpm wrangler -c apps/docs/wrangler.production.json deploy --env production
      # A new custom domain can take a few minutes to get its certificate, so
      # a first deploy that does not answer yet is a warning, not a failure.
      # www. is a Redirect Rule on the zone, set up once by hand
      # (apps/docs/README.md); this only reports whether it is in place.
      - name: Check appflare.dev answers
        if: steps.secrets.outputs.ready == 'true'
        env:
          SITE: ${{ steps.config.outputs.site }}
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 10 \
            --retry-all-errors "${SITE}/start/install/" || true)
          [[ "${status}" == 200 ]] ||
            echo "::warning::${SITE}/start/install/ answered ${status}, expected 200"
          for path in /deploy/ /deploy/callback; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 10 \
              --retry-all-errors "${SITE}${path}" || true)
            [[ "${status}" == 200 ]] ||
              echo "::warning::${SITE}${path} answered ${status}, expected 200"
          done
          answer=$(curl -sS -X POST -H 'content-type: application/json' -d '{}' \
            -w ' %{http_code}' --retry 5 --retry-delay 10 --retry-all-errors \
            "${SITE}/api/install/accounts" || true)
          [[ "${answer}" == *'"code":"unauthorized"'*' 401' ]] ||
            echo "::warning::${SITE}/api/install/accounts answered \"${answer}\", expected the installer's 401"
          www="${SITE/https:\/\//https://www.}"
          redirect=$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' --retry 5 \
            --retry-delay 10 --retry-all-errors "${www}/start/install/?from=ci" || true)
          [[ "${redirect}" == "301 ${SITE}/start/install/?from=ci" ]] ||
            echo "::warning::${www}/start/install/?from=ci answered \"${redirect}\", not a 301 to ${SITE}: the zone's www Redirect Rule is not set up yet (apps/docs/README.md)"
